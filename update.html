<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Member Info | Smart Rehabilitation Lab</title>
<meta name="description" content="스마트재활연구실 구성원 정보 등록·수정 요청.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="members">
<div id="site-header"></div>
<main>
<section class="phead"><div class="wrap">
  <p class="crumb"><a href="index.html">Home</a> / <a href="members.html">Members</a> / Update</p>
  <h1 class="headline">Keep your profile current.</h1>
  <p class="sub">홈페이지 Members에 올라갈 정보를 보내 주십시오. 연구실에서 확인한 뒤 반영합니다.</p>
</div></section>

<div class="wrap upd-done" id="done" hidden>
  <h2 class="title">제출되었습니다.</h2>
  <p class="sub">연구실에서 내용을 확인한 뒤 홈페이지에 반영합니다. 반영까지 며칠이 걸릴 수 있습니다.</p>
  <div class="actions"><a class="btn" href="members.html">Members로 돌아가기</a><a class="btn line" href="update.html">다시 작성하기</a></div>
</div>

<form class="wrap upd" id="upd" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="_subject" value="[Smart Rehab Lab] 구성원 정보 등록·수정 요청">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_next" id="next">
  <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

  <fieldset>
    <legend>요청 내용</legend>
    <div class="f-row">
      <label class="f"><span>요청 구분</span>
        <select name="요청 구분" required><option value="">선택</option><option>신규 등록</option><option>정보 수정</option><option>사진만 교체</option><option>삭제 요청</option></select></label>
      <label class="f"><span>구분</span>
        <select name="구분" id="kind" required><option value="">선택</option><option>Researcher</option><option>Ph.D. 과정</option><option>M.S. 과정</option><option>박사 수료</option><option>졸업생</option></select></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>기본 정보</legend>
    <div class="f-row">
      <label class="f"><span>국문 이름</span><input name="국문 이름" required autocomplete="name"></label>
      <label class="f"><span>영문 이름</span><input name="영문 이름" required placeholder="Gildong Hong"></label>
    </div>
    <label class="f"><span>면허·학위 표기</span><input name="면허·학위 표기" placeholder="PT, MS / PT, PhD / PT, MS Candidate"><small>이름 뒤에 붙는 표기입니다. 예: Wonhyung Kang, PT, MS Candidate</small></label>
    <label class="f"><span>연구 관심분야 (영문)</span><input name="연구 관심분야" placeholder="MSK disorders, Exercise"><small>영문 키워드 2~3개를 쉼표로 구분해 적어 주십시오.</small></label>
    <div class="f-row">
      <label class="f"><span>이메일</span><input type="email" name="이메일" required autocomplete="email"></label>
      <label class="f"><span>이메일 공개</span>
        <select name="이메일 홈페이지 공개" required><option value="">선택</option><option>공개</option><option>비공개</option></select></label>
    </div>
    <label class="f"><span>ORCID 또는 Google Scholar 주소 (선택)</span><input name="ORCID/Scholar" placeholder="https://orcid.org/0000-0000-0000-0000"></label>
  </fieldset>

  <fieldset data-for="student" hidden>
    <legend>재학 정보</legend>
    <label class="f"><span>과정 입학연도</span><input name="과정 입학연도" inputmode="numeric" placeholder="2025"></label>
  </fieldset>

  <fieldset data-for="alumni" hidden>
    <legend>졸업 정보</legend>
    <div class="f-row">
      <label class="f"><span>취득 학위</span><select name="취득 학위"><option value="">선택</option><option>Ph.D.</option><option>M.S.</option></select></label>
      <label class="f"><span>졸업연도</span><input name="졸업연도" inputmode="numeric" placeholder="2024"></label>
    </div>
    <label class="f"><span>현재 소속과 직위</span><input name="현재 소속·직위" placeholder="OO대학교 물리치료학과 조교수"></label>
  </fieldset>

  <fieldset>
    <legend>사진</legend>
    <label class="f"><span>상반신 증명사진 (선택)</span><input type="file" name="attachment" id="photo" accept="image/jpeg,image/png"><small>JPG 또는 PNG, 5MB 이하. 가로 600px 이상이면 선명하게 나옵니다. 배경은 연구실에서 흰색으로 맞춥니다.</small></label>
    <label class="f"><span>기타 요청사항 (선택)</span><textarea name="기타 요청사항" rows="4"></textarea></label>
  </fieldset>

  <label class="agree"><input type="checkbox" name="공개 동의" value="동의" required><span>위 정보 중 이름, 표기, 관심분야, 소속, 사진, 공개를 선택한 이메일이 연구실 홈페이지에 게시되는 것에 동의합니다.</span></label>
  <p class="f-err" id="err" role="alert"></p>
  <button class="btn" type="submit">제출하기</button>
</form>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  var f = document.getElementById("upd");
  f.action = "https://formsubmit.co/" + (SITE.formKey || SITE.email);
  document.getElementById("next").value = location.href.split(/[?#]/)[0] + "?sent=1";
  if (/[?&]sent=1/.test(location.search)) { f.hidden = true; document.getElementById("done").hidden = false; }
  var kind = document.getElementById("kind");
  function sync() {
    var v = kind.value, map = { student: /과정|수료/.test(v), alumni: v === "졸업생" };
    f.querySelectorAll("fieldset[data-for]").forEach(function (fs) {
      var on = !!map[fs.dataset.for]; fs.hidden = !on;
      fs.querySelectorAll("input,select").forEach(function (i) { i.disabled = !on; });
    });
  }
  kind.addEventListener("change", sync); sync();
  f.addEventListener("submit", function (e) {
    var p = document.getElementById("photo").files[0], err = document.getElementById("err");
    err.textContent = "";
    if (p && p.size > 5 * 1024 * 1024) { e.preventDefault(); err.textContent = "사진 파일이 5MB를 넘습니다. 더 작은 파일로 다시 선택해 주십시오."; }
  });
})();
</script>
</body>
</html>
